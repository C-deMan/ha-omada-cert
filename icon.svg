<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="omadaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cloudflareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="240" r="160" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />

  <!-- Main Security Shield (SSL/Certificates) -->
  <path d="M 256 70 C 345 110 395 125 410 170 C 410 295 335 385 256 425 C 177 385 102 295 102 170 C 117 125 167 110 256 70 Z" 
        fill="url(#shieldGrad)" />

  <!-- Inner Shield Highlight Layer -->
  <path d="M 256 95 C 330 130 370 142 385 180 C 385 285 320 360 256 398 C 192 360 127 285 127 180 C 142 142 182 130 256 95 Z" 
        fill="#0f172a" opacity="0.55" />

  <!-- Cloudflare Cloud Symbol (Top Center inside Shield) -->
  <path d="M 295 195 C 302 195 308 189 308 182 C 308 171 299 162 288 162 C 286 162 284 162 282 163 C 277 151 264 142 250 142 C 233 142 219 154 216 170 C 213 170 210 169 207 169 C 196 169 187 178 187 189 C 187 190 187 191 187 192 C 182 194 178 199 178 205 C 178 212 184 218 192 218 L 295 218 C 303 218 310 211 310 203 C 310 198 304 195 295 195 Z" 
        fill="url(#cloudflareGrad)" />

  <!-- Omada Network Nodes Ring / WiFi Waves -->
  <!-- Upper WiFi Arc -->
  <path d="M 190 255 C 230 220 282 220 322 255" fill="none" stroke="url(#omadaGrad)" stroke-width="12" stroke-linecap="round" />
  <!-- Middle WiFi Arc -->
  <path d="M 215 280 C 240 258 272 258 297 280" fill="none" stroke="url(#omadaGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Center Lock Body (SSL Security Anchor) -->
  <rect x="224" y="295" width="64" height="52" rx="12" fill="#ffffff" />
  <path d="M 238 295 L 238 280 C 238 270 246 262 256 262 C 266 262 274 270 274 280 L 274 295" 
        fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <!-- Lock Keyhole -->
  <circle cx="256" cy="315" r="5" fill="#0f172a" />
  <path d="M 254 318 L 258 318 L 260 332 L 252 332 Z" fill="#0f172a" />

  <!-- Success Checkmark Badge (Bottom Right of Shield) -->
  <circle cx="365" cy="365" r="42" fill="#10b981" stroke="#0f172a" stroke-width="8" />
  <path d="M 348 365 L 360 377 L 384 353" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
