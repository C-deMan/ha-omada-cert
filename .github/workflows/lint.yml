name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pylint:
    name: Python Lint (Pylint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint requests urllib3

      - name: Run Pylint
        run: |
          pylint rootfs/deploy_omada.py rootfs/web_server.py

  addon-lint:
    name: Home Assistant Add-on Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Home Assistant Add-on Linter
        uses: frenck/action-addon-linter@v2.16
        with:
          path: "."
