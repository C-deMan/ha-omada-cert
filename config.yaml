name: "Omada & Cloudflare SSL Certificate Manager"
version: "1.4.1"
slug: "omada_cloudflare_ssl"
description: "Automatically issue and renew Let's Encrypt certificates via Cloudflare DNS-01 and deploy them to TP-Link Omada Controller and Home Assistant."
url: "https://github.com/C-deMan/ha-omada-cert"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: "services"
boot: "auto"
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:certificate"
map:
  - "ssl:rw"

options:
  domains:
    - "omada.yourdomain.com"
  cloudflare_api_token: "YOUR_CLOUDFLARE_API_TOKEN"
  letsencrypt_email: "admin@yourdomain.com"
  copy_to_ha_ssl: true
  ssl_subdir: "omada"
  timezone: ""
  schedule_frequency: "daily"
  schedule_time: "03:00"
  omada:
    enabled: true
    url: "https://192.168.1.1:8043"
    client_id: "YOUR_OMADA_CLIENT_ID"
    client_secret: "YOUR_OMADA_CLIENT_SECRET"
    verify_ssl: false

schema:
  domains:
    - str
  cloudflare_api_token: password
  letsencrypt_email: email
  copy_to_ha_ssl: bool?
  ssl_subdir: str?
  timezone: str?
  schedule_frequency: list(every day|daily|weekly|monthly)?
  schedule_time: str?
  omada:
    enabled: bool
    url: str?
    client_id: str?
    client_secret: password?
    omadac_id: str?
    verify_ssl: bool?
